/* =========================
   🔔 إشعارات الهاتف
========================= */

function urlBase64ToUint8Array(base64String){
 const padding="=".repeat((4-base64String.length%4)%4);
 const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
 const rawData=atob(base64);
 return Uint8Array.from([...rawData].map(c=>c.charCodeAt(0)));
}

async function enablePushNotifications(){
 try{
  if(!user){
   toast("سجّل الدخول أولًا");
   return;
  }

  if(!("serviceWorker" in navigator)){
   toast("متصفحك لا يدعم Service Worker");
   return;
  }

  if(!("PushManager" in window)){
   toast("متصفحك لا يدعم الإشعارات");
   return;
  }

  if(!("Notification" in window)){
   toast("الإشعارات غير مدعومة في هذا المتصفح");
   return;
  }

  const permission=await Notification.requestPermission();

  if(permission!=="granted"){
   toast("لم يتم السماح بالإشعارات");
   return;
  }

  const registration=await navigator.serviceWorker.register("./sw.js");

  let subscription=await registration.pushManager.getSubscription();

  if(!subscription){
   subscription=await registration.pushManager.subscribe({
    userVisibleOnly:true,
    applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
   });
  }

  const {error}=await sb.from("push_subscriptions").upsert({
   user_id:user.id,
   endpoint:subscription.endpoint,
   subscription:subscription.toJSON()
  },{onConflict:"endpoint"});

  if(error){
   console.error(error);
   toast("تعذر حفظ إعداد الإشعارات");
   return;
  }

  toast("تم تفعيل تذكير الهاتف 🔔");

 }catch(error){
  console.error(error);
  toast("حدث خطأ أثناء تفعيل الإشعارات");
 }
}

let signupMode=false;

function toggleAuth(){
 signupMode=!signupMode;
 document.getElementById("authTitle").textContent=signupMode?"إنشاء حساب جديد 🏡":"تسجيل الدخول 🔐";
 document.getElementById("authBtn").textContent=signupMode?"إنشاء الحساب":"دخول";
 document.getElementById("familyNameField").style.display=signupMode?"block":"none";
 document.getElementById("switchText").textContent=signupMode?"لديك حساب؟":"ليس لديك حساب؟";
 document.getElementById("switchBtn").textContent=signupMode?"تسجيل الدخول":"إنشاء حساب"
}

async function authAction(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email||!password)return toast("أدخل البريد الإلكتروني وكلمة المرور");

 if(signupMode){
  const familyName=(document.getElementById("familyName").value.trim()||"عائلتي");

  const {data,error}=await sb.auth.signUp({email,password});

  if(error){
   document.getElementById("authMsg").innerHTML=`<div class="notice error">${esc(error.message)}</div>`;
   return
  }

  if(data.user&&data.session){
   user=data.user;
   await ensureFamily(familyName);
   await loadApp();
  }else{
   document.getElementById("authMsg").innerHTML='<div class="notice">تم إنشاء الحساب. افتح رسالة التأكيد في بريدك الإلكتروني، ثم ارجع للموقع وسجّل الدخول.</div>';
  }

 }else{

  const {data,error}=await sb.auth.signInWithPassword({email,password});

  if(error){
   document.getElementById("authMsg").innerHTML=`<div class="notice error">بيانات الدخول غير صحيحة أو الحساب غير مؤكد. تأكد من البريد وكلمة المرور ثم جرّب مرة أخرى.</div>`;
   return
  }

  user=data.user;
  await loadApp();
 }
}

async function resetPassword(){

}

async function ensureFamily(name="عائلتي"){
 if(!user)return;

 let {data}=await sb.from("families").select("*").eq("id",user.id).maybeSingle();

 if(!data){
  const r=await sb.from("families").insert({
   id:user.id,
   family_name:name
  }).select().single();

  if(!r.error)data=r.data
 }

 family=data;
}

async function loadData(){
 const c=await sb.from("children").select("*").order("created_at",{ascending:true});

 if(c.error){
  toast("تعذر تحميل أفراد العائلة");
  return
 }

 children=c.data||[];

 const ids=children.map(x=>x.id);

 prayers=[];

 if(ids.length){
  const p=await sb.from("prayers")
   .select("*")
   .in("child_id",ids)
   .order("prayer_date",{ascending:false})
   .limit(500);

  if(!p.error)prayers=p.data||[]
 }

 if(children.length&&!currentChild)currentChild=children[0];

 if(currentChild&&!children.some(x=>x.id===currentChild.id)){
  currentChild=children[0]||null
 }
}

async function checkAdmin(){
 const r=await sb.rpc("is_admin");
 isAdmin=!r.error&&r.data===true
}

async function loadApp(){
 await ensureFamily();
 await loadData();
 await checkAdmin();
 renderApp()
}

  return `<div class="member">

}

 if(f.error||c.error||p.error){

========================= */

async function saveFajr(val){
 if(!currentChild)return toast("اختر أحد أفراد العائلة أولًا");

 const payload={
  child_id:currentChild.id,
  prayer_date:today(),
  fajr:val
 };

 const {error}=await sb.from("prayers").upsert(
  payload,
  {onConflict:"child_id,prayer_date"}
 );

 if(error){
  toast("تعذر حفظ الإجابة: "+error.message);
  return
 }

 await loadData();
 renderApp();

 toast(
  val?
  "تم تسجيل: صليت الحمد لله ✓":
  "تم تسجيل إجابتك، نسأل الله أن يعيننا جميعًا."
 );
}

function selectChild(id){
 currentChild=children.find(c=>c.id===id)||null;
 renderApp()
}

async function addChild(){
 const name=prompt("اكتب اسم فرد العائلة:");
 if(!name?.trim())return;

 const year=prompt("سنة الميلاد (اختياري):");

 const {error}=await sb.from("children").insert({
  family_id:user.id,
  name:name.trim(),
  birth_year:year?Number(year):null
 });

 if(error){
  toast("تعذر إضافة العضو");
 }else{
  await loadData();
  currentView="family";
  renderApp();
  toast("تمت إضافة العضو ✓")
 }
}

function streak(){
 if(!children.length)return 0;

 let n=0;
 let d=new Date();

 for(let i=0;i<366;i++){

  const ds=dayKey(d);

  const dayRows=children.map(c=>
   prayers.find(p=>p.child_id===c.id&&p.prayer_date===ds)
  );

  if(dayRows.length&&dayRows.every(p=>p?.fajr)){
   n++;
   d.setDate(d.getDate()-1);
  }else{
   break
  }
 }

 return n;
}

function showPrayerHistory(){

 const dates=[
  ...new Set(prayers.map(p=>p.prayer_date))
 ].sort().reverse().slice(0,60);

 const rows=dates.map(ds=>{

  const ps=prayers.filter(
   p=>p.prayer_date===ds&&p.fajr
  );

  return `<tr>
   <td>${esc(ds)}</td>
   <td>${ps.length}</td>
   <td>
    ${ps.map(p=>{
     const c=children.find(x=>x.id===p.child_id);
     return esc(c?.name||"عضو")
    }).join("، ")}
   </td>
  </tr>`
 }).join("");

 document.getElementById("root").insertAdjacentHTML(
  "beforeend",
  `<div class="modal" id="historyModal">

   <div class="modalBox">

    <div class="modalHead">
     <h2>📅 سجل الفجر</h2>
     <button class="close" onclick="document.getElementById('historyModal').remove()">✕</button>

  </div>`
 );
}

/* =========================
   تشغيل التطبيق
========================= */

async function init(){

 const {data}=await sb.auth.getSession();

 if(data.session){
  user=data.session.user;
  await loadApp();
 }else{
  showAuth()
 }

 sb.auth.onAuthStateChange(
  async(event,session)=>{
   if(event==="SIGNED_IN"&&session){
    user=session.user;
    await loadApp()
   }
  }
 );
}

init();
